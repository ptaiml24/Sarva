name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: test-ci-secret-32-characters-min
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npm run db:generate
      - name: Migrate
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - name: Seed
        run: npm run db:seed
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: api
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: test-ci-secret-32-characters-min
      CI: "true"
      PM_PROPOSE_E2E_STUB: "true"
      PM_PLAN_BOARD_E2E_STUB: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npm run db:generate
      - name: Migrate
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - name: Seed
        run: npm run db:seed
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Playwright cache status
        run: |
          echo "playwright-cache-hit=${{ steps.playwright-cache.outputs.cache-hit }}"
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: timeout 15m npx playwright install chromium
      - name: E2E
        run: npm run e2e
