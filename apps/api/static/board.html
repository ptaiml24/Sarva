<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sarva R1 — Board (minimal)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 1rem auto; padding: 0 1rem; }
    pre { background: #f4f4f4; padding: 1rem; overflow: auto; }
    label { display: block; margin: 0.5rem 0 0.25rem; }
    input { width: 100%; max-width: 32rem; padding: 0.35rem; }
    button { margin-top: 0.5rem; padding: 0.4rem 0.8rem; }
    .err { color: #a00; }
  </style>
</head>
<body>
  <h1>Sarva R1 — Task board (minimal L4)</h1>
  <p>Log in via API, then list tasks for a project. Token is stored only in sessionStorage.</p>
  <label>Email <input type="email" id="email" placeholder="admin@example.com" /></label>
  <button type="button" id="login">Login (dev JWT)</button>
  <label>Project ID <input type="text" id="projectId" placeholder="UUID from seed / API" /></label>
  <button type="button" id="load">Load tasks</button>
  <p id="msg" class="err"></p>
  <h2>Tasks</h2>
  <pre id="out">(none)</pre>
  <script>
    const api = () => '';
    function token() { return sessionStorage.getItem('token') || ''; }
    document.getElementById('login').onclick = async () => {
      document.getElementById('msg').textContent = '';
      const email = document.getElementById('email').value;
      const r = await fetch(api() + '/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, role: 'admin' }),
      });
      const j = await r.json();
      if (!r.ok) { document.getElementById('msg').textContent = JSON.stringify(j); return; }
      sessionStorage.setItem('token', j.token);
      document.getElementById('out').textContent = 'Logged in. token stored.';
    };
    document.getElementById('load').onclick = async () => {
      document.getElementById('msg').textContent = '';
      const projectId = document.getElementById('projectId').value.trim();
      if (!projectId) { document.getElementById('msg').textContent = 'Set project ID'; return; }
      const r = await fetch(api() + '/api/v1/tasks?projectId=' + encodeURIComponent(projectId), {
        headers: { Authorization: 'Bearer ' + token() },
      });
      const j = await r.json();
      document.getElementById('out').textContent = JSON.stringify(j, null, 2);
    };
  </script>
</body>
</html>
